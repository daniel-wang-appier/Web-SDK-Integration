<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>結帳 | Mori Market</title>
    <meta name="description" content="Mori Market 模擬結帳頁面。" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body data-page="checkout">
    <header class="site-header">
      <div class="container site-header__inner">
        <a href="index.html" class="brand" aria-label="Mori Market 首頁">
          <span class="brand__mark">M</span>
          <span>Mori Market</span>
        </a>
        <nav class="site-header__nav" aria-label="主要導覽">
          <a href="index.html">首頁</a>
          <a href="cart.html" class="cart-link" aria-label="前往購物車">
            <span>購物車</span>
            <span class="cart-badge" data-cart-count aria-live="polite" hidden>0</span>
          </a>
        </nav>
      </div>
    </header>

    <main class="container checkout-layout">
      <section>
        <div class="section-header">
          <h1>確認下單</h1>
        </div>

        <div class="empty-state" data-cart-empty hidden>
          <h2>購物車是空的</h2>
          <p>先挑選幾個喜歡的商品再來結帳。</p>
          <a class="button" href="index.html">回到商店</a>
        </div>

        <form class="checkout-form" data-checkout-form novalidate>
          <div class="checkout-form__fieldset">
            <div class="form-field">
              <label for="full-name">姓名</label>
              <input id="full-name" name="full-name" type="text" required />
            </div>
            <div class="form-field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" required />
            </div>
            <div class="form-field">
              <label for="address">收件地址</label>
              <input id="address" name="address" type="text" required />
            </div>
            <button class="button" type="submit">確認下單</button>
          </div>
        </form>

        <div class="order-success" data-order-success hidden>
          <h2>訂單成立</h2>
          <p>感謝你的購買，訂單編號為 <strong data-order-number>MM-000000</strong>。</p>
          <a class="button" href="index.html">回到商店</a>
        </div>
      </section>

      <aside aria-labelledby="checkout-summary-heading">
        <div class="section-header">
          <h2 id="checkout-summary-heading">訂單摘要</h2>
        </div>
        <div class="checkout-panel">
          <ul class="checkout-panel__list" data-order-summary></ul>
          <div data-checkout-amounts></div>
        </div>
      </aside>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
